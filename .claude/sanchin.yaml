# sanchin checks its own docs with its own validator.
version: 1
language: en
components: []
docs:
  root: docs
  index: docs/index.md
  navigation_line: '^\[README\]\('
  unindexed_catalogs: []
  code_reference_globs: ['scripts/**/*.py']
stories: {directory: docs/stories, glob: '*.md'}
scenarios: {globs: []}
plans: {directory: docs/plans}
gates:
  - {name: unit-tests, glob: 'scripts/**/*.py', run: 'PYTHONPATH=scripts:tests uv run --quiet --no-project --with pyyaml python3 -m unittest discover -s tests', level: pre-push}
